version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: argus-postgres
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d argus']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: argus-api
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/argus
      # Clerk secrets should be provided via .env file or environment variables
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    container_name: argus-frontend
    ports:
      - '80:80'
    depends_on:
      - api
    # Optionally map environment variables to Vite using --build-arg if needed
    # For now relying on standard build

volumes:
  pgdata:
