name: Restrict main PRs to source branch dev

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-source-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify that the source branch is dev
        if: github.head_ref != 'dev'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "ERROR: Pull Requests targeting 'main' are only allowed from the 'dev' branch."
          printf 'Current source branch is: %s\n' "$PR_HEAD_REF"
          exit 1
      - name: Validation passed
        run: echo "PR source branch is 'dev'. Validation passed successfully."
