name: Argus CI

on:
  push:
    branches: [ "main", "feature/*", "codex/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: argus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: |
        cd api
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.lock
        python -m pip install pip-audit
    - name: Audit Python dependencies
      run: |
        cd api
        pip-audit -r requirements.lock
    - name: Run Pytest
      run: |
        python -m pytest api/tests -q
        python -m pytest db/tests -q
    - name: Check fresh migrations and database security
      env:
        ARGUS_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/argus_test
        ARGUS_TEST_DATABASE_NAME: argus_test
        ARGUS_ENABLE_DESTRUCTIVE_TESTS: I_CONFIRM_DISPOSABLE_DATABASE
        DATABASE_URL_HR_ADMIN: postgresql+asyncpg://hr_admin:hr-test-only@localhost:5432/argus_test
        DATABASE_URL_COMPLIANCE_AUDITOR: postgresql+asyncpg://compliance_auditor:audit-test-only@localhost:5432/argus_test
      run: python scripts/run_launch_checks.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Audit frontend dependencies
      run: |
        cd frontend
        npm audit --audit-level=high
    - name: Lint and build frontend
      working-directory: frontend
      env:
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
      run: |
        npm run lint
        npm run build
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps
    - name: Run Playwright Tests
      env:
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
      run: |
        cd frontend
        npx playwright test
