name: Argus CI

on:
  push:
    branches: [ "main", "feature/*", "codex/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: argus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: |
        cd api
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.lock
        python -m pip install pip-audit
    - name: Audit Python dependencies
      run: |
        cd api
        pip-audit -r requirements.lock
    - name: Run Pytest
      run: |
        python -m pytest api/tests -q
        python -m pytest db/tests -q
    - name: Check fresh migrations and database security
      env:
        ARGUS_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/argus_test
        ARGUS_TEST_DATABASE_NAME: argus_test
        ARGUS_ENABLE_DESTRUCTIVE_TESTS: I_CONFIRM_DISPOSABLE_DATABASE
        DATABASE_URL_HR_ADMIN: postgresql+asyncpg://hr_admin:hr-test-only@localhost:5432/argus_test
        DATABASE_URL_COMPLIANCE_AUDITOR: postgresql+asyncpg://compliance_auditor:audit-test-only@localhost:5432/argus_test
      run: python scripts/run_launch_checks.py
    - name: Validate deployment image without secrets
      run: |
        docker build -f api/Dockerfile -t argus-ci .
        docker run --rm -i --entrypoint python argus-ci - <<'PY'
        import os
        import ssl
        from pathlib import Path
        assert os.getuid() == 10001
        context = ssl.create_default_context(cafile='/app/certificates/supabase-ca.crt')
        assert context.check_hostname and context.verify_mode == ssl.CERT_REQUIRED
        for path in ('.env', '.env.production', 'keys', 'api/tests', 'db/tests', 'db/bench'):
            assert not Path('/app', path).exists(), path
        from api.middleware.request_safety import RequestSafetyMiddleware
        from db.crypto.actor_context import create_actor_context
        from db.cli.actor_context_keys import main
        print('Non-root deployment image includes its public CA and excludes secrets and test data.')
        PY

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Audit frontend dependencies
      run: |
        cd frontend
        npm audit --audit-level=high
    - name: Lint and build frontend
      working-directory: frontend
      env:
        VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_inert_test_key
      run: |
        npm run lint
        npm run build
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps
    - name: Run Playwright Tests
      env:
        VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
        VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_inert_test_key
      run: |
        cd frontend
        npx playwright test
