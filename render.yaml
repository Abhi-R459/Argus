# Add verifier_private_key.pem and public_key.pem as Render secret files.
# Keep migration administrator credentials off the API runtime service.
# Free web services sleep when idle. No disks, paid workers or expiring databases.
# Public-repository deployments are manual; check the release commit's CI first.
services:
  - type: web
    name: argus-backend
    branch: main
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL_HR_ADMIN
        sync: false
      - key: DATABASE_URL_COMPLIANCE_AUDITOR
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        value: https://arguss.in
      - key: CORS_ORIGINS
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_SALT
        sync: false
      - key: AUDIT_CONTEXT_SECRET
        sync: false
      - key: AUDIT_CONTEXT_KEY_ID
        sync: false
      - key: SIGNING_PRIVATE_KEY_PATH
        value: "/etc/secrets/verifier_private_key.pem"
      - key: CHECKPOINT_PUBLIC_KEYS_DIR
        value: /etc/secrets
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: ALLOW_CONCURRENCY_DIAGNOSTICS
        value: "false"
      - key: ANCHOR_STORE
        value: "none"
      # Blueprint default only. The live service can override this in Render.
      # Verify the effective value and remote anchor before each release.
      - key: GITHUB_ANCHOR_REPOSITORY
        sync: false
      - key: GITHUB_ANCHOR_TOKEN
        sync: false
      - key: GITHUB_ANCHOR_BRANCH
        value: "main"
      - key: GITHUB_ANCHOR_MIN_SEQUENCE
        sync: false
      # For the independent free witness path, set ANCHOR_STORE=witness_services
      # only after two separately operated services pass a live readback.
      - key: WITNESS_READ_ENDPOINTS_JSON
        sync: false
      - key: WITNESS_TRUST_CONFIG_JSON
        sync: false
      - key: WITNESS_MIN_SEQUENCE
        sync: false
      - key: SUSPICIOUS_ACTIVITY_REFRESH_SECONDS
        value: "300"
      - key: INTEGRITY_MONITOR_ENABLED
        value: "true"
      - key: INTEGRITY_MONITOR_INTERVAL_SECONDS
        value: "300"
      - key: SECURITY_ALERT_WEBHOOK_URL
        sync: false

  - type: web
    name: argus-frontend
    branch: main
    runtime: static
    rootDir: frontend
    domains:
      - arguss.in
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build:production
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_ENABLE_DIAGNOSTICS
        value: "false"
      - key: VITE_API_TIMEOUT_MS
        value: "90000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
