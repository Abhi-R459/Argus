<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Argus data model</title>
  <desc id="desc">A presentation-ready overview of Argus workforce data, audit events, and integrity records with their relationships.</desc>
  <defs>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { font-size: 18px; fill: #526079; }
      .group-title { font-size: 17px; font-weight: 700; letter-spacing: 1.1px; fill: #526079; }
      .table-title { font-size: 20px; font-weight: 700; fill: #fff; }
      .column { font-size: 15px; fill: #26334a; }
      .key { font-size: 12px; font-weight: 700; fill: #fff; }
      .edge-label { font-size: 13px; font-weight: 650; fill: #475773; }
      .foot { font-size: 15px; fill: #526079; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#26334a" flood-opacity=".10" />
    </filter>
  </defs>

  <rect width="1600" height="1120" fill="#f4f7fb" />
  <text x="64" y="76" class="title">ARGUS · DATA MODEL</text>
  <text x="64" y="110" class="subtitle">Workforce changes become linked audit evidence, then signed and independently checkable checkpoints.</text>

  <rect x="54" y="144" width="482" height="876" rx="18" fill="#eaf2ff" />
  <rect x="559" y="144" width="482" height="876" rx="18" fill="#e9f8f4" />
  <rect x="1064" y="144" width="482" height="876" rx="18" fill="#f1edff" />
  <text x="80" y="184" class="group-title">1 · WORKFORCE RECORDS</text>
  <text x="585" y="184" class="group-title">2 · AUDIT &amp; REVIEW</text>
  <text x="1090" y="184" class="group-title">3 · INTEGRITY EVIDENCE</text>

  <!-- Relationship lines sit behind the table cards. -->
  <g fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M292 337 V369" />
    <path d="M292 517 V549" />
    <path d="M292 697 V729" />
    <path d="M511 623 H594" />
    <path d="M800 337 V388" />
    <path d="M1016 623 H1098" />
    <path d="M1016 623 C1054 623 1057 825 1098 825" />
    <path d="M807 697 V748" />
  </g>
  <g class="edge-label">
    <text x="307" y="360">has roles</text>
    <text x="307" y="540">assigned role</text>
    <text x="307" y="720">effective-dated pay</text>
    <text x="526" y="608">employee subject</text>
    <text x="817" y="365">actor</text>
    <text x="1023" y="608">checkpoint sequence</text>
    <text x="1045" y="790">may cover</text>
    <text x="823" y="725">sequence reference</text>
    <text x="1022" y="810">checkpoint boundary</text>
  </g>

  <!-- Workforce tables -->
  <g filter="url(#shadow)">
    <g transform="translate(80 208)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#c9d8f0" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#356ac3" />
      <text x="18" y="29" class="table-title">departments</text>
      <text x="18" y="70" class="column">department_id</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#356ac3"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">name</text><rect x="380" y="83" width="37" height="22" rx="5" fill="#64748b"/><text x="386" y="99" class="key">UK</text>
    </g>
    <g transform="translate(80 388)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#c9d8f0" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#356ac3" />
      <text x="18" y="29" class="table-title">roles</text>
      <text x="18" y="70" class="column">role_id</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#356ac3"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">department_id · title · salary band</text><rect x="380" y="83" width="37" height="22" rx="5" fill="#14866d"/><text x="386" y="99" class="key">FK</text>
    </g>
    <g transform="translate(80 568)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#c9d8f0" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#356ac3" />
      <text x="18" y="29" class="table-title">employees</text>
      <text x="18" y="70" class="column">employee_id · full_name · email</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#356ac3"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">role_id · protected fields · status</text><rect x="380" y="83" width="37" height="22" rx="5" fill="#14866d"/><text x="386" y="99" class="key">FK</text>
    </g>
    <g transform="translate(80 748)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#c9d8f0" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#356ac3" />
      <text x="18" y="29" class="table-title">salary_history</text>
      <text x="18" y="70" class="column">salary_history_id · employee_id</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#356ac3"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">amount · effective_date · created_at</text>
    </g>
  </g>

  <!-- Audit and review tables -->
  <g filter="url(#shadow)">
    <g transform="translate(585 208)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#b9e2d6" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#16836e" />
      <text x="18" y="29" class="table-title">users</text>
      <text x="18" y="70" class="column">user_id · clerk_user_id · email</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#16836e"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">role · is_active · created_at</text>
    </g>
    <g transform="translate(585 388)">
      <rect width="430" height="309" rx="12" fill="#fff" stroke="#b9e2d6" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#16836e" />
      <text x="18" y="29" class="table-title">audit_log</text>
      <text x="18" y="72" class="column">sequence_id</text><rect x="392" y="54" width="25" height="22" rx="5" fill="#16836e"/><text x="399" y="70" class="key">PK</text>
      <text x="18" y="103" class="column">actor_user_id · employee_id</text>
      <text x="18" y="134" class="column">action · table_name · row_id</text>
      <text x="18" y="165" class="column">old_value · new_value</text>
      <text x="18" y="196" class="column">previous_hash · entry_hash</text>
      <text x="18" y="227" class="column">created_at</text>
      <text x="18" y="275" class="column" fill="#526079">One row per recorded database change</text>
    </g>
    <g transform="translate(585 748)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#b9e2d6" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#16836e" />
      <text x="18" y="29" class="table-title">security_audit_events</text>
      <text x="18" y="70" class="column">event_id · event_type · actor</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#16836e"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">employee_id · sequence_id · client_ip</text>
    </g>
    <g transform="translate(585 908)">
      <rect width="430" height="88" rx="12" fill="#fff" stroke="#b9e2d6" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#16836e" />
      <text x="18" y="29" class="table-title">suspicious_activity_flags → reviews</text>
      <text x="18" y="70" class="column">flag_reason · reviewer · action · note</text>
    </g>
  </g>

  <!-- Integrity tables -->
  <g filter="url(#shadow)">
    <g transform="translate(1090 388)">
      <rect width="430" height="309" rx="12" fill="#fff" stroke="#d5c9f1" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#7051b8" />
      <text x="18" y="29" class="table-title">chain_checkpoints</text>
      <text x="18" y="72" class="column">checkpoint_id · sequence_id</text><rect x="392" y="54" width="25" height="22" rx="5" fill="#7051b8"/><text x="399" y="70" class="key">PK</text>
      <text x="18" y="103" class="column">checkpoint_hash · signature · key_id</text>
      <text x="18" y="134" class="column">merkle_root · merkle_leaf_count</text>
      <text x="18" y="165" class="column">created_at</text>
      <text x="18" y="275" class="column">Signed boundary in the audit sequence</text>
    </g>
    <g transform="translate(1090 748)">
      <rect width="430" height="129" rx="12" fill="#fff" stroke="#d5c9f1" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#7051b8" />
      <text x="18" y="29" class="table-title">backups</text>
      <text x="18" y="70" class="column">backup_id · chain_checkpoint_id</text><rect x="392" y="52" width="25" height="22" rx="5" fill="#7051b8"/><text x="399" y="68" class="key">PK</text>
      <text x="18" y="101" class="column">backup_hash · file_reference · created_at</text>
    </g>
    <g transform="translate(1090 908)">
      <rect width="430" height="88" rx="12" fill="#fff" stroke="#d5c9f1" />
      <path d="M0 12 Q0 0 12 0 H418 Q430 0 430 12 V43 H0Z" fill="#7051b8" />
      <text x="18" y="29" class="table-title">chain_state</text>
      <text x="18" y="70" class="column">tail_sequence_id · tail_hash · last_checkpoint</text>
    </g>
  </g>

  <text x="64" y="1068" class="foot">Simplified for presentation. See ER_DIAGRAM.md and the Alembic migrations for the full schema and implementation details.</text>
</svg>
